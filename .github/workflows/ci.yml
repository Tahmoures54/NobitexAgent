name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q server analysis api core execution money portfolio trading tests
      - name: Test
        env:
          SECRET_KEY: ci-test-secret-key-12345678901234567890
          DATABASE_URL: sqlite:///./data/ci.db
          DEBUG: "true"
          AUTO_CREATE_DB: "true"
          RUN_SCHEDULER: "false"
        run: pytest -q
