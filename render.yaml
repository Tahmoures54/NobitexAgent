services:
  - type: web
    name: nobitexagent
    runtime: docker
    plan: free
    healthCheckPath: /health/db
    autoDeploy: true
    dockerCommand: sh -c "alembic upgrade head && uvicorn server.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: RUN_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nobitexagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nobitexagent-rate-limit
          type: keyvalue
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "[]"
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: PRICES_INTERVAL_SECONDS
        value: "60"
      - key: SCAN_LIMIT
        value: "250"

  - type: worker
    name: nobitexagent-worker
    runtime: docker
    plan: starter
    dockerCommand: sh -c "alembic upgrade head && python worker.py"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: RUN_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nobitexagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nobitexagent-rate-limit
          type: keyvalue
          property: connectionString
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: PRICES_INTERVAL_SECONDS
        value: "60"
      - key: SCAN_LIMIT
        value: "250"
      - key: MARKET_HISTORY_ENABLED
        value: "true"
      - key: MARKET_HISTORY_RETENTION_DAYS
        value: "30"
      - key: MARKET_HISTORY_MAX_ROWS_PER_SCAN
        value: "250"
      - key: CRYPTOSSCANNER_CMC_KEY
        sync: false

  - type: keyvalue
    name: nobitexagent-rate-limit
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: nobitexagent-db
    plan: free
    databaseName: nobitexagent
    user: nobitexagent