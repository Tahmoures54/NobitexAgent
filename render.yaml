services:
  - type: web
    name: nobitexagent
    runtime: docker
    plan: free
    healthCheckPath: /health/db
    autoDeploy: true
    dockerCommand: sh -c "alembic upgrade head && uvicorn server.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: RUN_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nobitexagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nobitexagent-rate-limit
          type: keyvalue
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: "[]"
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: PRICES_INTERVAL_SECONDS
        value: "60"
      - key: SCAN_LIMIT
        value: "250"

  - type: worker
    name: nobitexagent-worker
    runtime: docker
    plan: free
    dockerCommand: python worker.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: RUN_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nobitexagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nobitexagent-rate-limit
          type: keyvalue
          property: connectionString
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: PRICES_INTERVAL_SECONDS
        value: "60"
      - key: SCAN_LIMIT
        value: "250"

  - type: keyvalue
    name: nobitexagent-rate-limit
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: nobitexagent-db
    plan: free
    databaseName: nobitexagent
    user: nobitexagent