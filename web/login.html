<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — CryptoScanner</title>
<link rel="icon" href="/assets/eagle.png" type="image/png" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div x-data="authApp()" x-init="init()"
     class="w-full max-w-md panel fade-in">

  <div class="text-center mb-6">
    <div style="font-size:40px;">🦅</div>
    <h1 class="text-xl font-bold mt-2">CryptoScanner</h1>
    <p class="text-xs" style="color:var(--text-muted);"
       x-text="mode === 'login' ? 'Welcome back' : 'Create your free account'"></p>
  </div>

  <!-- Tab switcher -->
  <div class="flex mb-5" style="background:var(--bg-panel-alt); border-radius:8px; padding:4px;">
    <button @click="switchMode('login')"
            :class="mode === 'login' ? 'btn btn-primary' : 'btn btn-ghost'"
            class="flex-1" style="padding:8px;">Sign in</button>
    <button @click="switchMode('register')"
            :class="mode === 'register' ? 'btn btn-primary' : 'btn btn-ghost'"
            class="flex-1" style="padding:8px;">Create account</button>
  </div>

  <form @submit.prevent="submit()" class="space-y-3">
    <div>
      <label class="block text-xs mb-1" style="color:var(--text-secondary);">Email</label>
      <input x-model="email" type="email" required autocomplete="email"
             placeholder="you@example.com" class="input" />
    </div>

    <div>
      <label class="block text-xs mb-1" style="color:var(--text-secondary);">
        Password
        <span x-show="mode === 'register'"
              style="color:var(--text-muted);"> (min 6 chars)</span>
      </label>
      <input x-model="password" type="password" required
             :minlength="mode === 'register' ? 6 : null"
             :autocomplete="mode === 'login' ? 'current-password' : 'new-password'"
             placeholder="••••••••" class="input" />
    </div>

    <div x-show="error" x-cloak
         class="text-xs p-2 rounded"
         style="color:#FCA5A5; background:rgba(239,68,68,.1);"
         x-text="error"></div>

    <button type="submit" :disabled="busy"
            class="btn btn-primary w-full" style="padding:12px;">
      <span x-show="!busy"
            x-text="mode === 'login' ? 'Sign in' : 'Create account'"></span>
      <span x-show="busy">Please wait…</span>
    </button>
  </form>

  <p class="text-center text-xs mt-5" style="color:var(--text-muted);">
    <a href="/">← Back to scanner</a>
  </p>
</div>

<script src="/app.js"></script>
<script>
  function authApp() {
    return {
      mode: 'login',
      email: '',
      password: '',
      busy: false,
      error: '',
      next: '/dashboard.html',

      init() {
        // Already logged in? Go to dashboard
        if (Auth.isLoggedIn()) {
          window.location.href = this.getNext();
          return;
        }
        // Prefill email if we have it from a previous session
        const prev = Auth.getUser();
        if (prev && prev.email) this.email = prev.email;

        const urlParams = new URLSearchParams(window.location.search);
        const m = urlParams.get('mode');
        if (m === 'register' || m === 'login') this.mode = m;
      },

      getNext() {
        const params = new URLSearchParams(window.location.search);
        const n = params.get('next');
        if (n && n.startsWith('/')) return n;
        return '/dashboard.html';
      },

      switchMode(m) {
        this.mode = m;
        this.error = '';
      },

      async submit() {
        this.busy = true;
        this.error = '';
        try {
          const fn = this.mode === 'login' ? API.auth.login : API.auth.register;
          const res = await fn(this.email.trim(), this.password);
          Auth.setSession(res.access_token, res.user);
          UI.success(this.mode === 'login' ? 'Welcome back!' : 'Account created!');
          setTimeout(() => { window.location.href = this.getNext(); }, 400);
        } catch (err) {
          this.error = err.message || 'Something went wrong.';
        } finally {
          this.busy = false;
        }
      },
    };
  }
  window.authApp = authApp;
</script>
</body>
</html>
