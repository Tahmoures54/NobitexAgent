# alembic.ini
# ════════════════════════════════════════════════════════════════
# Alembic configuration for CryptoScanner
#
# The real database URL is injected at runtime by alembic/env.py
# from `server.config.settings.database_url`. The value below is a
# placeholder and is intentionally not used.
# ════════════════════════════════════════════════════════════════

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden in env.py
sqlalchemy.url = sqlite:///./data/app.db


# ── Logging ────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S